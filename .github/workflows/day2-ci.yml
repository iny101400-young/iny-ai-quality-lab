# 2일차 6교시: push·PR마다 테스트, 품질 게이트, 성능 리포트를 자동으로 실행합니다.
# fork한 저장소에서는 Actions 탭에서 워크플로 실행을 한 번 허용해야 동작합니다.

name: day2-ml-quality

on:
  push:
    paths:
      - "day2/**"
      - ".github/workflows/day2-ci.yml"
  pull_request:
    paths:
      - "day2/**"
      - ".github/workflows/day2-ci.yml"
  workflow_dispatch:
    # Actions 화면의 Run workflow 버튼에서 품질 게이트 기준값을 바꿔 실행할 수 있습니다 (코드 수정 없이).
    inputs:
      min_cv_recall:
        description: "품질 게이트: 교차 검증 재현율(악성) 최소 기준"
        default: "0.90"
      max_noise_drop:
        description: "품질 게이트: 잡음에 따른 재현율 하락 허용치"
        default: "0.02"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: day2/requirements.txt

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 테스트 + 커버리지 (품질 게이트 포함)
        run: pytest --cov=mlqa --cov-report=term-missing
        env:
          MIN_CV_RECALL: ${{ inputs.min_cv_recall || '0.90' }}
          MAX_NOISE_DROP: ${{ inputs.max_noise_drop || '0.02' }}

      - name: 성능 리포트 생성
        if: always()
        run: python -m mlqa.report
        env:
          PYTHONPATH: src

      - name: 리포트를 실행 요약에 표시
        if: always()
        run: cat reports/model_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 리포트 파일 보관 (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-report
          path: day2/reports/
